name: vale
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vale-gateway
    restart: unless-stopped
    ports:
      - "3017:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 40s

networks:
  default:
  edge:
    external: true
    name: ndehpms
